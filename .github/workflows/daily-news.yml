name: ULAK Günlük Yazılı Haber Bülteni

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ulak-daily-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-news:
    if: vars.ULAK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Yazılı bülteni hazırla
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --connect-timeout 20 --max-time 180 \
            --output response.json --write-out "%{http_code}" \
            "https://ulaknews-docs.vercel.app/api/presenter")
          if [ "$http_code" != "200" ]; then
            echo "::error::Haber sunucusu HTTP $http_code yanıtı verdi."
            cat response.json
            exit 1
          fi
          jq -e '
            (.script | type == "string" and length > 0) and
            (.news | type == "array" and length <= 10) and
            (.speechSegments | type == "array" and length == (.news | length) + 2) and
            .speechSegments[0].type == "intro" and
            ([.speechSegments[1:-1][] | select(.type == "story")] | length == (.news | length)) and
            .speechSegments[-1].type == "closing"
          ' response.json > /dev/null
          mkdir -p docs/docs/public/data
          jq --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'del(.audioSegments) + {generatedAt: $generatedAt}' \
            response.json > docs/docs/public/data/daily.json
      - name: Yalnızca yazılı bülteni kaydet
        run: |
          git config user.name "ULAK News Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/docs/public/data/daily.json
          if ! git diff --cached --quiet; then
            git commit -m "Günlük ULAK yazılı haber bülteni"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
