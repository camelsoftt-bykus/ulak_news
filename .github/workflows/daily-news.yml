name: ULAK Günlük Haber Otomasyonu

on:
  push:
    paths:
      - "docs/docs/app/api/presenter/route.ts"
      - "docs/docs/app/api/tts/route.ts"
      - "docs/docs/app/api/news-image/route.ts"
      - "docs/docs/lib/rss-reader.ts"
      - "docs/docs/lib/news-sources.ts"
      - "docs/docs/public/animasyon.html"
      - "docs/docs/scripts/render-video.mjs"
      - ".github/workflows/daily-news.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki bültenin üretilip birbirinin Git push işlemini bozmasını önle.
concurrency:
  group: ulak-daily-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Playwright ve Chromium kur
        working-directory: docs/docs
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Günlük sunumu hazırla
        run: |
          set -e

          presenter_url="https://ulaknews-docs.vercel.app/api/presenter"
          presenter_ok=false

          for attempt in 1 2 3; do
            set +e
            http_code=$(curl --silent --show-error --connect-timeout 20 --max-time 180 \
              --output response.json --write-out "%{http_code}" "$presenter_url")
            curl_exit=$?
            set -e

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ]; then
              presenter_ok=true
              break
            fi

            echo "Presenter API denemesi $attempt başarısız. HTTP: ${http_code:-bilinmiyor}, curl çıkış kodu: $curl_exit"
            echo "Sunucunun hata yanıtı:"
            cat response.json 2>/dev/null || true

            if [ "$attempt" -lt 3 ] && { [ "$curl_exit" -ne 0 ] || [ "$http_code" = "429" ] || [[ "${http_code:-}" =~ ^5 ]]; }; then
              sleep 15
              continue
            fi

            break
          done

          if [ "$presenter_ok" != "true" ]; then
            echo "::error::Haber sunucusu üç denemeden sonra da başarılı yanıt vermedi."
            exit 1
          fi

          if ! jq -e '.script and (.news | type == "array")' response.json > /dev/null; then
            echo "::error::Haber sunucusu 200 döndürdü ancak yanıt biçimi geçersiz."
            cat response.json
            exit 1
          fi

          mkdir -p docs/docs/public/data

          jq --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {generatedAt: $generatedAt}' \
            response.json > docs/docs/public/data/daily.json

      - name: Tek parça WAV yedeğini üret
        continue-on-error: true
        run: |
          set -e
          mkdir -p docs/docs/public/data

          jq -n --arg text "$(jq -r '.script' response.json)" \
            '{text: $text}' > tts-fallback-request.json

          if curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @tts-fallback-request.json \
            "https://ulaknews-docs.vercel.app/api/tts" \
            -o docs/docs/public/data/daily.wav && \
            test -s docs/docs/public/data/daily.wav; then
            echo "Tek parça WAV yedeği hazır."
          else
            echo "::warning::Tek parça WAV yedeği üretilemedi; segmentli akış kullanılacak."
            rm -f docs/docs/public/data/daily.wav
          fi

      - name: Her sunum segmenti için ayrı WAV üret
        run: |
          set -euo pipefail

          data_dir="docs/docs/public/data"
          mkdir -p "$data_dir"
          rm -f "$data_dir"/seg-*.wav
          jq -e '.speechSegments | type == "array" and length > 0' response.json > /dev/null

          segment_count=$(jq '.speechSegments | length' response.json)
          echo "Üretilecek ses segmenti: $segment_count"

          files_json='[]'

          for i in $(seq 0 $((segment_count - 1))); do
            segment_text=$(jq -r --argjson i "$i" '.speechSegments[$i].text' response.json)
            if [ -z "$segment_text" ] || [ "$segment_text" = "null" ]; then
              echo "::error::Segment $i metni boş."
              exit 1
            fi

            filename="seg-$(printf '%02d' "$i").wav"
            output="$data_dir/$filename"
            request_file="tts-segment-request-$i.json"

            jq -n --arg text "$segment_text" '{text: $text}' > "$request_file"
            text_length=$(printf '%s' "$segment_text" | wc -m | tr -d ' ')

            success=false
            for attempt in 1 2 3; do
              rm -f "$output"
              response_file=$(mktemp)
              http_code=""
              curl_exit=0

              if http_code=$(curl --silent --show-error \
                --connect-timeout 20 --max-time 180 \
                -X POST \
                -H "Content-Type: application/json" \
                --data-binary @"$request_file" \
                "https://ulaknews-docs.vercel.app/api/tts" \
                --output "$response_file" \
                --write-out "%{http_code}"); then
                curl_exit=0
              else
                curl_exit=$?
              fi

              if [ "$curl_exit" -eq 0 ] && \
                [ "$http_code" = "200" ] && \
                test -s "$response_file" && \
                ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
                  -of default=noprint_wrappers=1 "$response_file" > /dev/null; then
                mv "$response_file" "$output"
                success=true
                echo "Hazır: $filename ($(stat -c%s "$output") bayt), metin ${text_length} karakter, deneme ${attempt}."
                break
              fi

              echo "Segment $i denemesi $attempt başarısız. HTTP=${http_code:-yok}, curl çıkışı=${curl_exit}, metin=${text_length} karakter."

              if [ "$curl_exit" -eq 0 ] && [ -s "$response_file" ] && \
                jq -e . "$response_file" > /dev/null 2>&1; then
                jq -r '
                  "Hata kodu: " +
                  ((.error.status // .status // "bilinmiyor") | tostring
                    | gsub("[[:cntrl:]]"; " ")
                    | .[0:80])
                ' "$response_file" || echo "Hata kodu okunamadı."
              else
                echo "Yanıt JSON değil veya boş; yanıt gövdesi loglanmadı."
              fi

              rm -f "$response_file"
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done

            rm -f "$request_file"

            if [ "$success" != "true" ]; then
              echo "::error::Ses segmenti üretilemedi: $filename. Yayın durduruldu."
              exit 1
            fi

            files_json=$(jq -c --arg file "$filename" '. + [$file]' <<< "$files_json")
          done

          if [ "$(jq 'length' <<< "$files_json")" -ne "$segment_count" ]; then
            echo "::error::Üretilen WAV sayısı segment sayısıyla eşleşmiyor."
            exit 1
          fi

          jq --argjson files "$files_json" \
            '. + {audioSegments: $files}' \
            "$data_dir/daily.json" > "$data_dir/daily.json.tmp"
          mv "$data_dir/daily.json.tmp" "$data_dir/daily.json"

          echo "Segment doğrulaması tamamlandı: $segment_count metin / $(jq 'length' <<< "$files_json") WAV"

      - name: Robot sunum videosunu üret
        working-directory: docs/docs
        run: |
          node scripts/render-video.mjs

      - name: Günlük haber, ses ve videoyu kaydet
        run: |
          git config user.name "ULAK News Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/docs/public/data/daily.json
          git add -A docs/docs/public/data/daily.wav
          git add docs/docs/public/data/seg-*.wav
          git add docs/docs/public/data/daily.mp4
          git add docs/docs/public/data/daily-poster.jpg

          if ! git diff --cached --quiet; then
            git commit -m "Günlük ULAK haber, ses ve video bülteni"
            # Bülten üretimi sırasında başka bir commit geldiyse önce birleştir.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
