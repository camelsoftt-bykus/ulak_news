name: ULAK Günlük Haber Otomasyonu

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Playwright ve Chromium kur
        working-directory: docs/docs
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Günlük sunumu hazırla
        run: |
          set -e

          curl --fail --silent --show-error \
            "https://ulaknews-docs.vercel.app/api/presenter" \
            -o response.json

          jq -e '.script and (.news | type == "array")' response.json > /dev/null

          mkdir -p docs/docs/public/data

          jq --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {generatedAt: $generatedAt}' \
            response.json > docs/docs/public/data/daily.json

      - name: Ahmet sesiyle otomatik ses üret
        run: |
          set -e

          jq -n --arg text "$(jq -r '.script' response.json)" \
            '{text: $text}' > tts-request.json

          curl --fail --silent --show-error \
            --max-time 180 \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @tts-request.json \
            "https://ulaknews-docs.vercel.app/api/tts" \
            -o docs/docs/public/data/daily.mp3

          test -s docs/docs/public/data/daily.mp3

      - name: Robot sunum videosunu üret
        working-directory: docs/docs
        run: |
          node scripts/render-video.mjs

      - name: Günlük haber, ses ve videoyu kaydet
        run: |
          git config user.name "ULAK News Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/docs/public/data/daily.json
          git add docs/docs/public/data/daily.mp3
          git add docs/docs/public/data/daily.mp4

          if ! git diff --cached --quiet; then
            git commit -m "Günlük ULAK haber, ses ve video bülteni"
            git push
          fi
