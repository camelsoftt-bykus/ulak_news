name: ULAK Günlük Haber Otomasyonu

on:
  push:
    paths:
      - "docs/docs/app/api/presenter/route.ts"
      - "docs/docs/app/api/tts/route.ts"
      - "docs/docs/app/api/news-image/route.ts"
      - "docs/docs/lib/rss-reader.ts"
      - "docs/docs/lib/news-sources.ts"
      - "docs/docs/public/animasyon.html"
      - "docs/docs/scripts/render-video.mjs"
      - ".github/workflows/daily-news.yml"
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki bültenin üretilip birbirinin Git push işlemini bozmasını önle.
concurrency:
  group: ulak-daily-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Playwright ve Chromium kur
        working-directory: docs/docs
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Günlük sunumu hazırla
        run: |
          set -e

          presenter_url="https://ulaknews-docs.vercel.app/api/presenter"
          presenter_ok=false

          for attempt in 1 2 3; do
            set +e
            http_code=$(curl --silent --show-error --connect-timeout 20 --max-time 180 \
              --output response.json --write-out "%{http_code}" "$presenter_url")
            curl_exit=$?
            set -e

            if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ]; then
              presenter_ok=true
              break
            fi

            echo "Presenter API denemesi $attempt başarısız. HTTP: ${http_code:-bilinmiyor}, curl çıkış kodu: $curl_exit"
            echo "Sunucunun hata yanıtı:"
            cat response.json 2>/dev/null || true

            if [ "$attempt" -lt 3 ] && { [ "$curl_exit" -ne 0 ] || [ "$http_code" = "429" ] || [[ "${http_code:-}" =~ ^5 ]]; }; then
              sleep 15
              continue
            fi

            break
          done

          if [ "$presenter_ok" != "true" ]; then
            echo "::error::Haber sunucusu üç denemeden sonra da başarılı yanıt vermedi."
            exit 1
          fi

          if ! jq -e '.script and (.news | type == "array")' response.json > /dev/null; then
            echo "::error::Haber sunucusu 200 döndürdü ancak yanıt biçimi geçersiz."
            cat response.json
            exit 1
          fi

          mkdir -p docs/docs/public/data

          jq --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {generatedAt: $generatedAt}' \
            response.json > docs/docs/public/data/daily.json

      - name: Gemini ile doğal haber sunumu sesi üret
        run: |
          set -e

          jq -n --arg text "$(jq -r '.script' response.json)" \
            '{text: $text}' > tts-request.json

          curl --fail --silent --show-error \
            --max-time 180 \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @tts-request.json \
            "https://ulaknews-docs.vercel.app/api/tts" \
            -o docs/docs/public/data/daily.wav

          test -s docs/docs/public/data/daily.wav

      - name: Robot sunum videosunu üret
        working-directory: docs/docs
        run: |
          node scripts/render-video.mjs

      - name: Günlük haber, ses ve videoyu kaydet
        run: |
          git config user.name "ULAK News Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/docs/public/data/daily.json
          git add docs/docs/public/data/daily.wav
          git add docs/docs/public/data/daily.mp4
          git add docs/docs/public/data/daily-poster.jpg

          if ! git diff --cached --quiet; then
            git commit -m "Günlük ULAK haber, ses ve video bülteni"
            # Bülten üretimi sırasında başka bir commit geldiyse önce birleştir.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
